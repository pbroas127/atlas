<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas</title>
<meta name="description" content="A map of everything worth coming back to.">
<meta name="theme-color" content="#08090c">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236d7cff'/><circle cx='50' cy='50' r='24' fill='none' stroke='white' stroke-width='9' stroke-dasharray='75 100' transform='rotate(45 50 50)'/></svg>">
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <div class="mark"></div>
      <h1>Atlas</h1>
    </div>
    <p class="tagline">A map of everything worth coming back to — docs, links, games, and whatever else earns a place.</p>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="Search Atlas…" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn btn-primary" id="add-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
  </div>

  <main id="board"></main>

  <footer class="foot">
    <span id="count"></span>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="export-btn">Export JSON</button>
    <button class="btn btn-ghost" id="reset-btn">Reset</button>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
